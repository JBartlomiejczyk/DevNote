name: CI

on:
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Format, Build, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test DevNote.Tests/DevNote.Tests.csproj --configuration Release --no-restore

  e2e:
    name: E2E Tests (optional)
    runs-on: ubuntu-latest
    needs: [ci]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build E2E project
        run: dotnet build DevNote.E2eTests/DevNote.E2eTests.csproj --configuration Release --no-restore

      - name: Install Playwright browsers
        run: pwsh DevNote.E2eTests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: E2E Tests
        run: dotnet test DevNote.E2eTests/DevNote.E2eTests.csproj --configuration Release --no-build
